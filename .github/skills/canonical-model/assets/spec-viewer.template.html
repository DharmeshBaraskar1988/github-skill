<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#18212b;--muted:#5f6b78;--line:#e2e6eb;--soft:#eef1f5;--accent:#1f5fae;--accent-soft:#e6eef9;
  --code-bg:#fbfcfd;--k:#1f5fae;--s:#1d7a4c;--n:#9a4a00;--b:#7a4fb3;--c:#7c8691;--ref:#b3261e;--hit:#fff3bf;--cur:#ffd96b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--panel:#161d24;--ink:#e3e8ee;--muted:#93a0ad;--line:#26313c;--soft:#1c252e;
  --accent:#6aa4ee;--accent-soft:#1a2b40;--code-bg:#11171d;--k:#7fb2f0;--s:#7fd0a4;--n:#f0b36a;--b:#c4a2f0;--c:#7c8691;--ref:#ef8a82;--hit:#3a3214;--cur:#6b5612}}
:root[data-theme="dark"]{--bg:#0f1419;--panel:#161d24;--ink:#e3e8ee;--muted:#93a0ad;--line:#26313c;--soft:#1c252e;
  --accent:#6aa4ee;--accent-soft:#1a2b40;--code-bg:#11171d;--k:#7fb2f0;--s:#7fd0a4;--n:#f0b36a;--b:#c4a2f0;--c:#7c8691;--ref:#ef8a82;--hit:#3a3214;--cur:#6b5612}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column}
header{padding:14px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px;font-weight:650}
.meta{color:var(--muted);font-size:12px}
button,select,input{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.layout{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;background:var(--panel);min-height:0}
aside h3{margin:0;padding:10px 14px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.doc{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 14px;cursor:pointer;border-left:3px solid transparent}
.doc:hover{background:var(--soft)}
.doc[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.doc small{display:block;color:var(--muted);font-size:11px;font-family:var(--mono)}
.outline a{display:block;padding:2px 14px 2px 22px;color:var(--ink);text-decoration:none;font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outline a.sec{padding-left:14px;font-family:var(--sans);font-weight:600;font-size:12px;margin-top:6px;color:var(--muted)}
.outline a:hover{background:var(--soft)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .title{font-weight:600;margin-right:auto;min-width:0}
.toolbar .title small{color:var(--muted);font-weight:400;margin-left:6px}
input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;width:180px}
.count{color:var(--muted);font-size:12px;min-width:56px;text-align:center}
.code{flex:1;overflow:auto;background:var(--code-bg);font:12.5px/1.55 var(--mono);padding:8px 0;min-height:0}
.ln{display:flex;white-space:pre}
.code.wrap .ln{white-space:pre-wrap;word-break:break-word}
.ln .g{flex:0 0 56px;text-align:right;padding-right:12px;color:var(--c);user-select:none}
.ln .t{flex:1;padding-right:16px}
.ln.hit{background:var(--hit)} .ln.cur{background:var(--cur)} .ln.flash{background:var(--accent-soft)}
.k{color:var(--k)} .s{color:var(--s)} .n{color:var(--n)} .b{color:var(--b)} .c{color:var(--c);font-style:italic} .p{color:var(--muted)}
.ref{color:var(--ref);text-decoration:underline;cursor:pointer}
.stats{padding:4px 14px 10px;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.empty{padding:30px;color:var(--muted)}
@media (max-width:820px){.layout{grid-template-columns:1fr}aside{max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}input[type=search]{width:100%}}
</style>
</head>
<body>
<header>
  <div><h1>{{TITLE}}</h1><div class="meta" id="meta"></div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="seg" role="group" aria-label="Format"><button id="fYaml" aria-pressed="true">YAML</button><button id="fJson" aria-pressed="false">JSON</button></div>
    <button class="btn" id="themeBtn" title="Light / dark">◐</button>
  </div>
</header>
<div class="layout">
  <aside>
    <h3>Documents</h3><div id="docs"></div>
    <div class="stats" id="stats"></div>
    <h3>Outline</h3><div class="outline" id="outline"></div>
  </aside>
  <section class="main">
    <div class="toolbar">
      <div class="title" id="docTitle"></div>
      <input type="search" id="q" placeholder="Search (Enter = next)" aria-label="Search">
      <button class="btn" id="prev" title="Previous match">↑</button><button class="btn" id="next" title="Next match">↓</button><span class="count" id="count"></span>
      <button class="btn" id="wrapBtn">Wrap</button>
      <button class="btn" id="copyBtn">Copy</button>
      <button class="btn" id="dlBtn">⭳ Download</button>
    </div>
    <div class="code" id="code" tabindex="0"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k,v){try{localStorage.setItem("specviewer:"+k,JSON.stringify(v))}catch(e){}}
function load(k){try{const v=localStorage.getItem("specviewer:"+k);return v?JSON.parse(v):null}catch(e){return null}}
const S={doc:0,fmt:load("fmt")||"yaml",q:"",hits:[],hi:-1,wrap:!!load("wrap")};
(function(){const t=load("theme");if(t)document.documentElement.dataset.theme=t;const h=decodeURIComponent(location.hash.slice(1));const i=DATA.docs.findIndex(d=>d.id===h);if(i>=0)S.doc=i})();
const KIND={"canonical-openapi":"Canonical OpenAPI","canonical-model":"Canonical model","enriched-openapi":"Enriched OpenAPI (analysis)","discovery-openapi":"Discovery OpenAPI","external-openapi":"External OpenAPI"};
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1500)}

// ---------- highlighting ----------
function val(v){
  const t=v.trim(); if(!t) return esc(v);
  const lead=v.slice(0,v.length-v.trimStart().length);
  if(/^#/.test(t)) return lead+`<span class="c">${esc(t)}</span>`;
  if(/^(['"]).*\1$/.test(t)) return lead+`<span class="s">${esc(t)}</span>`;
  if(/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t)) return lead+`<span class="n">${esc(t)}</span>`;
  if(/^(true|false|null|~)$/.test(t)) return lead+`<span class="b">${esc(t)}</span>`;
  if(/^[\[{]/.test(t)) return lead+`<span class="p">${esc(t)}</span>`;
  return lead+`<span class="s">${esc(t)}</span>`;
}
function refLink(v){const m=v.match(/^(\s*)(['"]?)(#\/[^'"]+)\2\s*$/);return m?`${m[1]}<span class="ref" data-ref="${esc(m[3])}">${esc(m[2]+m[3]+m[2])}</span>`:val(v)}
function hlYaml(line){
  if(/^\s*#/.test(line)) return `<span class="c">${esc(line)}</span>`;
  const m=line.match(/^(\s*(?:-\s+)*)((?:'[^']*'|"[^"]*"|[^\s'"#][^:#]*?)):(\s|$)(.*)$/);
  if(m){const isRef=/^['"]?\$ref['"]?$/.test(m[2]);return `${esc(m[1])}<span class="k">${esc(m[2])}</span>:${m[3]}${isRef?refLink(m[4]):val(m[4])}`}
  const d=line.match(/^(\s*-\s+)(.*)$/); if(d) return esc(d[1])+val(d[2]);
  return val(line);
}
function hlJson(line){
  let out="",last=0;const re=/("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b/g;let m,prevKey=null;
  while((m=re.exec(line))){out+=esc(line.slice(last,m.index));
    if(m[1]&&m[2]){out+=`<span class="k">${esc(m[1])}</span>${m[2]}`;prevKey=m[1]}
    else if(m[1]){out+=prevKey==='"$ref"'&&m[1].startsWith('"#/')?`<span class="ref" data-ref="${esc(m[1].slice(1,-1))}">${esc(m[1])}</span>`:`<span class="s">${esc(m[1])}</span>`}
    else if(m[3]) out+=`<span class="n">${m[3]}</span>`; else out+=`<span class="b">${m[4]}</span>`;
    last=re.lastIndex}
  return out+esc(line.slice(last));
}

// ---------- outline ----------
function outline(lines,doc,fmt){
  const items=[];
  if(fmt==="yaml"){
    let sec="",sub="";
    lines.forEach((l,i)=>{
      const top=l.match(/^([A-Za-z_][\w-]*):/); if(top){sec=top[1];sub="";items.push({sec:true,label:sec,line:i});return}
      if(sec==="paths"){const p=l.match(/^  (['"]?)(\/[^'"]*)\1:\s*$/);if(p)items.push({label:p[2],line:i})}
      if(sec==="components"){const s2=l.match(/^  ([\w-]+):\s*$/);if(s2){sub=s2[1];return}
        if(sub==="schemas"){const s=l.match(/^    ([\w.-]+):\s*$/);if(s)items.push({label:s[1],line:i})}}
      if(sec==="entities"){const e=l.match(/^- name: (.+)$/);if(e)items.push({label:e[1],line:i})}
      if(sec==="endpoints"){const e=l.match(/^- method: (\w+)/);if(e){const nx=(lines[i+1]||"").match(/^  path: (.+)$/);items.push({label:e[1]+" "+(nx?nx[1]:""),line:i})}}
    });
  }else{
    let sec="",sub="";
    lines.forEach((l,i)=>{
      const top=l.match(/^  "([^"]+)":/); if(top){sec=top[1];sub="";items.push({sec:true,label:sec,line:i});return}
      if(sec==="paths"){const p=l.match(/^    "(\/[^"]*)": \{/);if(p)items.push({label:p[1],line:i})}
      if(sec==="components"){const s2=l.match(/^    "([\w-]+)": \{/);if(s2){sub=s2[1];return}
        if(sub==="schemas"){const s=l.match(/^      "([\w.-]+)": \{/);if(s)items.push({label:s[1],line:i})}}
      if(sec==="entities"){const e=l.match(/^      "name": "([^"]+)"/);if(e)items.push({label:e[1],line:i})}
      if(sec==="endpoints"){const e=l.match(/^      "method": "(\w+)"/);if(e){const nx=(lines[i+1]||"").match(/^      "path": "([^"]+)"/);items.push({label:e[1]+" "+(nx?nx[1]:""),line:i})}}
    });
  }
  return items;
}
function schemaLine(lines,fmt,ref){
  const parts=ref.replace(/^#\//,"").split("/");const name=parts[parts.length-1];
  if(fmt==="yaml"){let inSch=false;for(let i=0;i<lines.length;i++){if(/^  schemas:\s*$/.test(lines[i]))inSch=true;else if(inSch&&lines[i]===`    ${name}:`)return i}}
  else{let inSch=false;for(let i=0;i<lines.length;i++){if(/^    "schemas": \{/.test(lines[i]))inSch=true;else if(inSch&&lines[i].startsWith(`      "${name}": {`))return i}}
  return -1;
}

// ---------- render ----------
let LINES=[];
function render(){
  const d=DATA.docs[S.doc];
  $("#meta").textContent=`${DATA.docs.length} document${DATA.docs.length===1?"":"s"} · YAML and JSON views show the same content`;
  const groups={};DATA.docs.forEach((x,i)=>(groups[x.kind]=groups[x.kind]||[]).push([x,i]));
  $("#docs").innerHTML=Object.entries(groups).map(([k,arr])=>`<h3 style="padding-top:6px">${esc(KIND[k]||k)}</h3>`+arr.map(([x,i])=>`<button class="doc" data-doc="${i}" aria-current="${i===S.doc}">${esc(x.label)}<small>${esc(x.path)}</small></button>`).join("")).join("");
  $("#fYaml").setAttribute("aria-pressed",S.fmt==="yaml");$("#fJson").setAttribute("aria-pressed",S.fmt==="json");
  if(!d){$("#code").innerHTML=`<div class="empty">No documents.</div>`;return}
  const text=S.fmt==="yaml"?d.yaml:d.json;LINES=text.replace(/\n$/,"").split("\n");
  $("#docTitle").innerHTML=`${esc(d.label)}<small>${esc(d.fileName.replace(/\.(ya?ml|json)$/,"")+(S.fmt==="yaml"?".yaml":".json"))} · ${LINES.length} lines</small>`;
  $("#stats").textContent=Object.entries(d.stats||{}).map(([k,v])=>`${v} ${k}`).join(" · ");
  const hl=S.fmt==="yaml"?hlYaml:hlJson;
  $("#code").classList.toggle("wrap",S.wrap);$("#wrapBtn").setAttribute("aria-pressed",S.wrap);
  $("#code").innerHTML=LINES.map((l,i)=>`<div class="ln" id="L${i}"><span class="g">${i+1}</span><span class="t">${hl(l)||" "}</span></div>`).join("");
  $("#outline").innerHTML=outline(LINES,d,S.fmt).map(o=>`<a href="#" class="${o.sec?"sec":""}" data-line="${o.line}" title="${esc(o.label)}">${esc(o.label)}</a>`).join("")||`<div class="stats">—</div>`;
  history.replaceState(null,"","#"+encodeURIComponent(d.id));
  search(S.q,true);
}
function goLine(i,flash=true){const el=document.getElementById("L"+i);if(!el)return;const c=$("#code");c.scrollTop=el.offsetTop-c.offsetTop-40;if(flash){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),900)}}
function search(q,keep){
  document.querySelectorAll(".ln.hit,.ln.cur").forEach(e=>e.classList.remove("hit","cur"));
  S.q=q;S.hits=[];if(!q){$("#count").textContent="";return}
  const ql=q.toLowerCase();LINES.forEach((l,i)=>{if(l.toLowerCase().includes(ql))S.hits.push(i)});
  S.hits.forEach(i=>document.getElementById("L"+i).classList.add("hit"));
  S.hi=S.hits.length?(keep&&S.hi>=0&&S.hi<S.hits.length?S.hi:0):-1;mark();
}
function mark(){document.querySelectorAll(".ln.cur").forEach(e=>e.classList.remove("cur"));
  $("#count").textContent=S.hits.length?`${S.hi+1} / ${S.hits.length}`:(S.q?"0 / 0":"");
  if(S.hi>=0){const i=S.hits[S.hi];document.getElementById("L"+i).classList.add("cur");goLine(i,false)}}
function step(d){if(!S.hits.length)return;S.hi=(S.hi+d+S.hits.length)%S.hits.length;mark()}

document.addEventListener("click",e=>{
  const doc=e.target.closest("[data-doc]");if(doc){S.doc=+doc.dataset.doc;S.hi=-1;render();$("#code").scrollTop=0;return}
  const ol=e.target.closest("[data-line]");if(ol){e.preventDefault();goLine(+ol.dataset.line);return}
  const rf=e.target.closest("[data-ref]");if(rf){const i=schemaLine(LINES,S.fmt,rf.dataset.ref);if(i>=0)goLine(i);else toast("Not found: "+rf.dataset.ref);return}
});
$("#fYaml").onclick=()=>{S.fmt="yaml";store("fmt","yaml");render()};
$("#fJson").onclick=()=>{S.fmt="json";store("fmt","json");render()};
$("#wrapBtn").onclick=()=>{S.wrap=!S.wrap;store("wrap",S.wrap);$("#code").classList.toggle("wrap",S.wrap)};
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>search(e.target.value.trim()),120)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();step(e.shiftKey?-1:1)}});
$("#copyBtn").onclick=async()=>{const d=DATA.docs[S.doc];const t=S.fmt==="yaml"?d.yaml:d.json;
  try{await navigator.clipboard.writeText(t);toast("Copied "+S.fmt.toUpperCase())}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(_){toast("Copy not allowed here - use Download")}ta.remove()}};
$("#dlBtn").onclick=()=>{const d=DATA.docs[S.doc];const yamlFmt=S.fmt==="yaml";const name=d.fileName.replace(/\.(ya?ml|json)$/,"")+(yamlFmt?".yaml":".json");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([yamlFmt?d.yaml:d.json],{type:yamlFmt?"application/yaml":"application/json"}));a.download=name;a.click()};
$("#themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";store("theme",r.dataset.theme)};
render();
</script>
</body>
</html>
