*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column}

.meta{color:var(--muted);font-size:12px}
button,select,input{font:inherit;color:var(--ink)}

.btn:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.layout{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;background:var(--panel);min-height:0}

.doc{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 14px;cursor:pointer;border-left:3px solid transparent}
.doc:hover{background:var(--soft)}
.doc[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.doc small{display:block;color:var(--muted);font-size:11px;font-family:var(--mono)}
.outline a{display:block;padding:2px 14px 2px 22px;color:var(--ink);text-decoration:none;font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outline a.sec{padding-left:14px;font-family:var(--sans);font-weight:600;font-size:12px;margin-top:6px;color:var(--muted)}
.outline a:hover{background:var(--soft)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .title{font-weight:600;margin-right:auto;min-width:0}
.toolbar .title small{color:var(--muted);font-weight:400;margin-left:6px}
input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;width:180px}
.count{color:var(--muted);font-size:12px;min-width:56px;text-align:center}
.code{flex:1;overflow:auto;background:var(--code-bg);font:12.5px/1.55 var(--mono);padding:8px 0;min-height:0}
.ln{display:flex;white-space:pre}
.code.wrap .ln{white-space:pre-wrap;word-break:break-word}
.ln .g{flex:0 0 56px;text-align:right;padding-right:12px;color:var(--c);user-select:none}
.ln .t{flex:1;padding-right:16px}
.ln.hit{background:var(--hit)} .ln.cur{background:var(--cur)} .ln.flash{background:var(--accent-soft)}
.k{color:var(--k)} .s{color:var(--s)} .n{color:var(--n)} .b{color:var(--b)} .c{color:var(--c);font-style:italic} .p{color:var(--muted)}
.ref{color:var(--ref);text-decoration:underline;cursor:pointer}
.stats{padding:4px 14px 10px;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.empty{padding:30px;color:var(--muted)}
@media (max-width:820px){.layout{grid-template-columns:1fr}aside{max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}input[type=search]{width:100%}}
</style>

function val(v){
  const t=v.trim(); if(!t) return esc(v);
  const lead=v.slice(0,v.length-v.trimStart().length);
  if(/^#/.test(t)) return lead+`<span class="c">${esc(t)}</span>`;
  if(/^(['"]).*\1$/.test(t)) return lead+`<span class="s">${esc(t)}</span>`;
  if(/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t)) return lead+`<span class="n">${esc(t)}</span>`;
  if(/^(true|false|null|~)$/.test(t)) return lead+`<span class="b">${esc(t)}</span>`;
  if(/^[\[{]/.test(t)) return lead+`<span class="p">${esc(t)}</span>`;

}

  $("#docTitle").innerHTML=`${esc(d.label)}<small>${esc(d.fileName.replace(/\.(ya?ml|json)$/,"")+(S.fmt==="yaml"?".yaml":".json"))} · ${LINES.length} lines</small>`;
  $("#stats").textContent=Object.entries(d.stats||{}).map(([k,v])=>`${v} ${k}`).join(" · ");
  const hl=S.fmt==="yaml"?hlYaml:hlJson;
  $("#code").classList.toggle("wrap",S.wrap);$("#wrapBtn").setAttribute("aria-pressed",S.wrap);
  $("#code").innerHTML=LINES.map((l,i)=>`<div class="ln" id="L${i}"><span class="g">${i+1}</span><span class="t">${hl(l)||" "}</span></div>`).join("");
  $("#outline").innerHTML=outline(LINES,d,S.fmt).map(o=>`<a href="#" class="${o.sec?"sec":""}" data-line="${o.line}" title="${esc(o.label)}">${esc(o.label)}</a>`).join("")||`<div class="stats">—</div>`;
  history.replaceState(null,"","#"+encodeURIComponent(d.id));
  search(S.q,true);
}
function goLine(i,flash=true){const el=document.getElementById("L"+i);if(!el)return;const c=$("#code");c.scrollTop=el.offsetTop-c.offsetTop-40;if(flash){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),900)}}
function search(q,keep){
  document.querySelectorAll(".ln.hit,.ln.cur").forEach(e=>e.classList.remove("hit","cur"));
  S.q=q;S.hits=[];if(!q){$("#count").textContent="";return}
  const ql=q.toLowerCase();LINES.forEach((l,i)=>{if(l.toLowerCase().includes(ql))S.hits.push(i)});
  S.hits.forEach(i=>document.getElementById("L"+i).classList.add("hit"));
  S.hi=S.hits.length?(keep&&S.hi>=0&&S.hi<S.hits.length?S.hi:0):-1;mark();
}
function mark(){document.querySelectorAll(".ln.cur").forEach(e=>e.classList.remove("cur"));
  $("#count").textContent=S.hits.length?`${S.hi+1} / ${S.hits.length}`:(S.q?"0 / 0":"");
  if(S.hi>=0){const i=S.hits[S.hi];document.getElementById("L"+i).classList.add("cur");goLine(i,false)}}
function step(d){if(!S.hits.length)return;S.hi=(S.hi+d+S.hits.length)%S.hits.length;mark()}

document.addEventListener("click",e=>{
  const doc=e.target.closest("[data-doc]");if(doc){S.doc=+doc.dataset.doc;S.hi=-1;render();$("#code").scrollTop=0;return}
  const ol=e.target.closest("[data-line]");if(ol){e.preventDefault();goLine(+ol.dataset.line);return}
  const rf=e.target.closest("[data-ref]");if(rf){const i=schemaLine(LINES,S.fmt,rf.dataset.ref);if(i>=0)goLine(i);else toast("Not found: "+rf.dataset.ref);return}
});
$("#fYaml").onclick=()=>{S.fmt="yaml";store("fmt","yaml");render()};
$("#fJson").onclick=()=>{S.fmt="json";store("fmt","json");render()};
$("#wrapBtn").onclick=()=>{S.wrap=!S.wrap;store("wrap",S.wrap);$("#code").classList.toggle("wrap",S.wrap)};
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>search(e.target.value.trim()),120)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();step(e.shiftKey?-1:1)}});
$("#copyBtn").onclick=async()=>{const d=DATA.docs[S.doc];const t=S.fmt==="yaml"?d.yaml:d.json;
  try{await navigator.clipboard.writeText(t);toast("Copied "+S.fmt.toUpperCase())}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(_){toast("Copy not allowed here - use Download")}ta.remove()}};
$("#dlBtn").onclick=()=>{const d=DATA.docs[S.doc];const yamlFmt=S.fmt==="yaml";const name=d.fileName.replace(/\.(ya?ml|json)$/,"")+(yamlFmt?".yaml":".json");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([yamlFmt?d.yaml:d.json],{type:yamlFmt?"application/yaml":"application/json"}));a.download=name;a.click()};
$("#themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";store("theme",r.dataset.theme)};
render();
</script>
</body>
</html>
