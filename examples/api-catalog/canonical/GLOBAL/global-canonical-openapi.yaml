      x-capability: Get Quote
      x-source-operations:
      - UK/quote:GetQuote
      x-regions:
      - UK
      x-applications:
      - UK/quote
  /quotes/{quoteRef}/bind:
    post:
      operationId: BindQuote
      tags:
      - Quote
      summary: Bind Quote
      parameters:
      - name: quoteRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
