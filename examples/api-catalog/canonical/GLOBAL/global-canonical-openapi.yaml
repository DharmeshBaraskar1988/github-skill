openapi: 3.0.3
info:
  title: Enterprise Canonical Insurance API
  version: 1.0.0
  description: Global canonical API merged from the approved canonical models of regions EU v1.0.0, UK v1.0.0. Do not edit
    by hand.
  x-region: GLOBAL
  x-status: approved
  x-baseline: null
  x-references:
  - name: EU canonical
    source: baseline
    version: 1.0.0
  - name: SAMPLE (not ACORD)
    source: acord
    version: '0.1'
  x-approved-by:
  - Asha (Claims architect)
  - Marco (Policy architect)
  - Priya (UK architect)
  x-regions:
  - region: EU
    version: 1.0.0
    released: true
  - region: UK
    version: 1.0.0
    released: true
servers:
- url: https://{host}
  variables:
    host:
      default: api.global.example.internal
tags:
- name: Claims
- name: Document Management
- name: Policy
- name: Quote
paths:
  /claims:
    get:
      operationId: SearchClaims
      tags:
      - Claims
      summary: Search claims with paging and optional status filter.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ClaimStatusCode'
      - name: page
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPage'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Search Claims
      x-source-operations:
      - EU/claims:listClaims
      x-regions:
      - EU
      x-applications:
      - EU/claims
    post:
      operationId: RegisterClaim
      tags:
      - Claims
      summary: Register a first notice of loss.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Claim'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Register Claim
      x-source-operations:
      - EU/claims:createClaim
      x-regions:
      - EU
      x-applications:
      - EU/claims
  /claims/{claimId}:
    delete:
      operationId: CloseClaim
      tags:
      - Claims
      summary: Close Claim
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Close Claim
      x-source-operations:
      - EU/claims:deleteClaim
      x-regions:
      - EU
      x-applications:
      - EU/claims
    get:
      operationId: ViewClaim
      tags:
      - Claims
      summary: Get a single claim by id.
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: View Claim
      x-source-operations:
      - EU/claims:getClaim
      x-regions:
      - EU
      x-applications:
      - EU/claims
    put:
      operationId: UpdateClaim
      tags:
      - Claims
      summary: Update Claim
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Claim'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Update Claim
      x-source-operations:
      - EU/claims:updateClaim
      x-regions:
      - EU
      x-applications:
      - EU/claims
  /claims/{claimId}/approve:
    post:
      operationId: ApproveClaim
      tags:
      - Claims
      summary: Approve Claim
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimApproval'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Approve Claim
      x-source-operations:
      - EU/claims:approveClaim
      x-regions:
      - EU
      x-applications:
      - EU/claims
  /claims/{claimId}/claim-parties:
    get:
      operationId: ManageClaimants
      tags:
      - Claims
      summary: Manage Claimants
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimParty'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Manage Claimants
      x-source-operations:
      - EU/claims:getClaimsClaimants
      x-regions:
      - EU
      x-applications:
      - EU/claims
  /claims/{claimId}/documents:
    get:
      operationId: ListDocuments
      tags:
      - Document Management
      summary: List documents attached to a claim.
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: List Documents
      x-source-operations:
      - EU/claims:listDocuments
      x-regions:
      - EU
      x-applications:
      - EU/claims
    post:
      operationId: UploadDocument
      tags:
      - Document Management
      summary: Upload a document for a claim.
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Upload Document
      x-source-operations:
      - EU/claims:uploadDocuments
      x-regions:
      - EU
      x-applications:
      - EU/claims
  /claims/{claimId}/documents/{documentId}:
    delete:
      operationId: DeleteDocument
      tags:
      - Document Management
      summary: Delete Document
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Delete Document
      x-source-operations:
      - EU/claims:deleteDocuments
      x-regions:
      - EU
      x-applications:
      - EU/claims
  /parties/{id}:
    get:
      operationId: GetPolicyholder
      tags:
      - Policy
      summary: Get Policyholder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Get Policyholder
      x-source-operations:
      - EU/policy:getPolicyholdersById
      x-regions:
      - EU
      x-applications:
      - EU/policy
  /policies:
    get:
      operationId: SearchPolicies
      tags:
      - Policy
      summary: Search Policies
      parameters:
      - name: holderName
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Search Policies
      x-source-operations:
      - EU/policy:getPolicies
      x-regions:
      - EU
      x-applications:
      - EU/policy
    post:
      operationId: IssuePolicy
      tags:
      - Policy
      summary: Issue Policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Issue Policy
      x-source-operations:
      - EU/policy:postPolicies
      x-regions:
      - EU
      x-applications:
      - EU/policy
  /policies/{policyNumber}:
    get:
      operationId: ViewPolicy
      tags:
      - Policy
      summary: View Policy
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: View Policy
      x-source-operations:
      - EU/policy:getPoliciesById
      x-regions:
      - EU
      x-applications:
      - EU/policy
  /policies/{policyNumber}/renew:
    post:
      operationId: RenewPolicy
      tags:
      - Policy
      summary: Renew Policy
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-capability: Renew Policy
      x-source-operations:
      - EU/policy:postPoliciesRenew
      x-regions:
      - EU
      x-applications:
      - EU/policy
  /quotes:
    post:
      operationId: CreateQuote
      tags:
      - Quote
      summary: Create Quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quote'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
      x-capability: Create Quote
      x-source-operations:
      - UK/quote:CreateQuote
      x-regions:
      - UK
      x-applications:
      - UK/quote
  /quotes/{quoteRef}:
    get:
      operationId: GetQuote
      tags:
