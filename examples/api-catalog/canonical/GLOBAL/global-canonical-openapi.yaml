          x-used-by-regions:
          - EU
        reporter:
          $ref: '#/components/schemas/Party'
          x-extension: true
          x-introduced-in: EU
          x-sources:
          - EU/claims:FnolSubmission.reporter
          x-available-in:
          - EU
          - UK
          x-used-by-regions:
          - EU
      required:
      - claimIdentifier
      - claimNumber
      - policyNumber
      - lossDate
      description: A demand for payment under a policy following a loss.
      x-domain: Claims
      x-approach: global
      x-reference-entity: acord:Claim
      x-introduced-in: EU
      x-status: approved
      x-source-schemas:
